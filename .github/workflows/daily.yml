name: Daily Landing Page

on:
  workflow_dispatch: {}
  schedule:
    # 13:00 UTC every day — edit to taste (cron is always UTC).
    - cron: '0 13 * * *'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and publish today's landing page
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/publish.mjs

      # GitHub disables scheduled workflows after 60 days without repo commits; re-enabling resets that timer.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
